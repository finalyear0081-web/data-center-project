<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Data Center Predictive Cooling System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-4" style="background-color: #f8fafc;">
    <div class="container" style="max-width: 440px;">
        <div class="card-industrial p-4">
            <div class="text-center mb-4">
                <span class="badge bg-primary mb-2">THERMAL AI v2.0</span>
                <h4 class="fw-bold mb-1">Data Center Monitoring</h4>
                <p class="text-secondary small">LSTM Temperature Forecasting & Predictive Cooling</p>
            </div>

            <form action="/dashboard" method="GET">
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Work Email</label>
                    <input type="email" class="form-control" value="admin@datacenter.internal" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Password</label>
                    <input type="password" class="form-control" value="demo12345" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">System Role</label>
                    <select class="form-select">
                        <option value="admin">System Administrator (Full Control & Thresholds)</option>
                        <option value="operator">Operations Engineer (Monitor & View)</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary-custom w-100 py-2 mb-3">Sign In to Dashboard</button>
            </form>

            <div class="text-center border-top pt-3 small">
                <span class="text-secondary">New operator? </span>
                <a href="/register" class="text-primary text-decoration-none fw-semibold">Enroll Account</a>
            </div>
        </div>
    </div>
</body>
</html>
