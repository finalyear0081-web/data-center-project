<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enroll - Data Center Predictive Cooling System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-4" style="background-color: #f8fafc;">
    <div class="container" style="max-width: 440px;">
        <div class="card-industrial p-4">
            <div class="text-center mb-4">
                <span class="badge bg-secondary mb-2">OPERATOR ENROLLMENT</span>
                <h4 class="fw-bold mb-1">Create Account</h4>
                <p class="text-secondary small">Enroll as an Authorized Data Center Operator</p>
            </div>

            <form action="/dashboard" method="GET">
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Full Name</label>
                    <input type="text" class="form-control" placeholder="Alex Morgan" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Work Email</label>
                    <input type="email" class="form-control" placeholder="alex@datacenter.internal" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Password</label>
                    <input type="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary-custom w-100 py-2 mb-3">Complete Registration</button>
            </form>

            <div class="text-center border-top pt-3 small">
                <span class="text-secondary">Already registered? </span>
                <a href="/login" class="text-primary text-decoration-none fw-semibold">Sign In</a>
            </div>
        </div>
    </div>
</body>
</html>
