<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Data Center Predictive Cooling System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-4">
    <div class="container" style="max-width: 440px;">
        <div class="card p-4 shadow-sm border">
            <div class="text-center mb-4">
                <div class="badge-tag d-inline-block mb-2">THERMAL AI v1.0</div>
                <h4 class="fw-bold mb-1">Data Center Monitoring</h4>
                <p class="text-secondary small">LSTM Temperature Forecasting & Cooling Optimization</p>
            </div>

            <div id="alertBox" class="alert alert-danger d-none py-2 small" role="alert"></div>

            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="name@datacenter.internal" value="admin@datacenter.internal" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" value="demo12345" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Operational Role</label>
                    <select id="role" class="form-select">
                        <option value="admin">Administrator (Full Control & Thresholds)</option>
                        <option value="operator">Operations Engineer (Monitor & View)</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 mb-3">Sign In to Dashboard</button>
            </form>

            <div class="border-top pt-3 text-center">
                <span class="small text-secondary">Need an account? </span>
                <a href="/register" class="small text-primary text-decoration-none fw-semibold">Register Operator</a>
            </div>

            <div class="mt-4 p-3 bg-light rounded border small">
                <div class="fw-semibold text-secondary mb-1">Quick Demo Sign-In:</div>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-sm btn-outline-secondary w-50" onclick="quickFill('admin@datacenter.internal', 'admin')">Admin</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary w-50" onclick="quickFill('operator@datacenter.internal', 'operator')">Operator</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function quickFill(email, role) {
            document.getElementById('email').value = email;
            document.getElementById('role').value = role;
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('alertBox');
            alertBox.classList.add('d-none');
            
            const email = document.getElementById('email').value.trim();
            const role = document.getElementById('role').value;
            
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email, role})
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('auth_token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = '/dashboard';
                } else {
                    alertBox.textContent = data.error || 'Authentication failed.';
                    alertBox.classList.remove('d-none');
                }
            } catch (err) {
                alertBox.textContent = 'Server connection error: ' + err.message;
                alertBox.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
