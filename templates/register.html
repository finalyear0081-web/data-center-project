<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Data Center Predictive Cooling System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-4">
    <div class="container" style="max-width: 440px;">
        <div class="card p-4 shadow-sm border">
            <div class="text-center mb-4">
                <div class="badge-tag d-inline-block mb-2">OPERATOR ENROLLMENT</div>
                <h4 class="fw-bold mb-1">Create Account</h4>
                <p class="text-secondary small">Access Data Center Monitoring System</p>
            </div>

            <div id="alertBox" class="alert alert-danger d-none py-2 small" role="alert"></div>

            <form id="registerForm">
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Full Name</label>
                    <input type="text" id="name" class="form-control" placeholder="Alex Morgan" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Work Email</label>
                    <input type="email" id="email" class="form-control" placeholder="alex@datacenter.internal" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required minlength="6">
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">System Role</label>
                    <select id="role" class="form-select">
                        <option value="operator">Operations Engineer (Read/Monitor)</option>
                        <option value="admin">System Administrator (Full Control & Thresholds)</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 mb-3">Complete Registration</button>
            </form>

            <div class="border-top pt-3 text-center">
                <span class="small text-secondary">Already registered? </span>
                <a href="/login" class="small text-primary text-decoration-none fw-semibold">Sign In</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('alertBox');
            alertBox.classList.add('d-none');
            
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const role = document.getElementById('role').value;
            
            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({name, email, role})
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('auth_token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = '/dashboard';
                } else {
                    alertBox.textContent = data.error || 'Registration failed.';
                    alertBox.classList.remove('d-none');
                }
            } catch (err) {
                alertBox.textContent = 'Server connection error: ' + err.message;
                alertBox.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
